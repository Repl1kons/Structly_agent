version: "3.9"

services:
  structly-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: structly-agent:local
    container_name: structly-agent
    restart: unless-stopped
    environment:
      STRUCTLY_AGENT_TOKEN: ${STRUCTLY_AGENT_TOKEN:?set STRUCTLY_AGENT_TOKEN in .env}
      STRUCTLY_BACKEND_URL: ${STRUCTLY_BACKEND_URL:-https://structly.elevo.space}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
